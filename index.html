<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<link rel="manifest" href="manifest.json">
<title>🇧🇦 波斯尼亚语词库</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f4f6;color:#111827;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
main{max-width:720px;margin:auto;padding:18px 15px 42px}h1{text-align:center;font-size:26px;margin:8px 0 18px}
.card{background:white;border-radius:20px;padding:18px;margin:12px 0;box-shadow:0 3px 16px #0001}
.tabs,.choices,.actions,.filters{display:grid;gap:9px}.tabs{grid-template-columns:repeat(3,1fr)}.choices{grid-template-columns:1fr 1fr}.actions{grid-template-columns:1fr 1fr 1fr}.filters{grid-template-columns:repeat(3,1fr)}
button{border:0;border-radius:13px;padding:13px 10px;font-size:15px;background:#e5e7eb;color:#111827}button.primary{background:#111827;color:#fff}
.question{min-height:130px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:36px;font-weight:750;padding:20px 5px}
.answer{text-align:center;font-size:19px;line-height:1.8;padding:10px 0 16px}.muted{color:#6b7280;font-size:13px;text-align:center}
input,textarea{width:100%;padding:12px;border:1px solid #d1d5db;border-radius:12px;font-size:16px;margin:5px 0 9px}
.hidden{display:none}
.badge{display:inline-block;padding:3px 7px;border-radius:9px;background:#eef2ff;font-size:12px}
/* 列表行 */
.row{border-bottom:1px solid #eee;padding:12px 0}
.row .t{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.row .bs{font-size:19px;font-weight:700}
.row .zh{font-size:15px;margin-top:2px}
.row .py{font-size:13px;color:#6b7280;margin-top:2px}
.row .cnt{font-size:12px;color:#9ca3af;white-space:nowrap}
.st{display:grid;grid-template-columns:repeat(3,1fr) 46px 46px;gap:6px;margin-top:9px}
.st button{padding:9px 2px;font-size:13px}
.st2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
button.s-forgot.on{background:#fecaca}button.s-maybe.on{background:#fde68a}button.s-known.on{background:#bbf7d0}
</style>
</head>
<body>
<main>
<h1>🇧🇦 波斯尼亚语词库</h1>

<div class="card">
  <div class="tabs">
    <button onclick="showPage('random')">随机抽取</button>
    <button onclick="showPage('list')">全部列表</button>
    <button onclick="showPage('import')">入库</button>
    <button onclick="showPage('today')">今日复习</button>
  </div>
</div>

<section id="random" class="card">
  <h3>随机抽取</h3>
  <div class="choices">
    <button id="modeBS" class="primary" onclick="setMode('bs')">波斯尼亚语 → 中文</button>
    <button id="modeZH" onclick="setMode('zh')">中文 → 波斯尼亚语</button>
  </div>
  <div class="choices" style="margin-top:9px">
    <button id="pickWeighted" class="primary" onclick="setPickMode('weighted')">① 全部随机</button>
    <button id="pickNoRepeat" onclick="setPickMode('norepeat')">② 抽到不重复</button>
  </div>
  <div class="filters" style="margin-top:9px">
    <button id="filterAll" class="primary" onclick="setFilter('all')">全部</button>
    <button id="filterMaybe" onclick="setFilter('maybe')">有印象随机</button>
    <button id="filterForgot" onclick="setFilter('forgot')">忘记随机</button>
  </div>
  <p class="muted" id="pickStats"></p>
  <div class="question" id="question"></div>
  <div id="answer" class="answer hidden"></div>
  <div class="actions">
    <button class="primary" onclick="reveal()">显示答案</button>
    <button onclick="rate('known')">记住了</button>
    <button onclick="next()">换一个</button>
  </div>
  <div class="actions" style="margin-top:9px">
    <button onclick="rate('maybe')">有印象</button>
    <button onclick="rate('forgot')">忘记了</button>
    <button onclick="resetStats()">重置记录</button>
  </div>
  <p class="muted" id="stats"></p>
</section>

<section id="list" class="card hidden">
  <h3>全部列表</h3>
  <div class="filters">
    <button id="listAll" class="primary" onclick="setListFilter('all')">全部</button>
    <button id="listMaybe" onclick="setListFilter('maybe')">有印象</button>
    <button id="listForgot" onclick="setListFilter('forgot')">忘记</button>
  </div>
  <div class="filters" style="margin-top:9px">
    <button id="listKnown" onclick="setListFilter('known')">记住</button>
    <button id="listNone" onclick="setListFilter('none')">未标记</button>
    <button onclick="resetStats()">重置全部记录</button>
  </div>
  <input id="search" placeholder="搜索中文 / 波斯尼亚语 / 谐音（c 可搜到 č、ć）" oninput="renderList()">
  <p class="muted" style="text-align:left">每个词下面可直接标记 忘记 / 有印象 / 记住（再点一次取消），✎ 修改，🗑 删除。</p>
  <div id="table"></div>
</section>

<section id="today" class="card hidden">
  <h3>今日复习 10 个</h3>
  <p class="muted">每天自动挑选最需要复习的 10 个单词；今天完成后，明天自动生成新的一组。</p>
  <p class="muted" id="todayStats"></p>
  <div class="question" id="todayQuestion"></div>
  <div id="todayAnswer" class="answer hidden"></div>
  <div class="actions">
    <button class="primary" onclick="todayReveal()">显示答案</button>
    <button onclick="todayRate('known')">记住了</button>
    <button onclick="todayNext()">换一个</button>
  </div>
  <div class="actions" style="margin-top:9px">
    <button onclick="todayRate('maybe')">有印象</button>
    <button onclick="todayRate('forgot')">忘记了</button>
    <button onclick="startToday(true)">重新生成</button>
  </div>
</section>

<section id="import" class="card hidden">
  <h3>入库</h3>
  <p class="muted" style="text-align:left">CSV格式：第一列中文，第二列波斯尼亚语，第三列中文谐音。第一行可以写表头。重复的单词（中文和波斯尼亚语都相同）会自动跳过。<br>用本页“导出整个词库”导出的文件，还会带上状态和记录次数，导回来进度不丢。</p>
  <textarea id="paste" rows="6" placeholder="中文,波斯尼亚语,中文谐音&#10;坏的/不好的,loše,洛舍&#10;剃须刀,brijač,布里亚奇"></textarea>
  <button class="primary" onclick="importText()">粘贴内容入库</button>
  <br><br>
  <input type="file" id="file" accept=".csv,.txt">
  <button onclick="importFile()">导入CSV</button>
  <button onclick="exportCSV()">导出整个词库</button>
  <p class="muted">词库保存在本机浏览器中。建议定期导出备份。</p>
</section>
</main>

<script>
const KEY="bosnian_vocab_v1";
let words=JSON.parse(localStorage.getItem(KEY)||"null")||[
{zh:"坏的/不好的",bs:"loše",py:"洛舍"},{zh:"非常/真/特别",bs:"baš",py:"巴什"},{zh:"非常多",bs:"baš puno",py:"巴什 普诺"},{zh:"剃须刀",bs:"brijač",py:"布里亚奇"},{zh:"烟灰缸",bs:"pepeljara",py:"佩佩利亚拉"},{zh:"灰/烟灰",bs:"pepeo",py:"佩佩奥"},{zh:"胸针",bs:"broš",py:"布罗什"},{zh:"望远镜",bs:"dvogled",py:"德沃格莱德"},{zh:"辫子",bs:"pletenica",py:"普莱特尼察"},{zh:"球拍",bs:"reket",py:"雷克特"},{zh:"夹子",bs:"štapaljke",py:"什塔帕利克"},{zh:"毛绒的",bs:"plišana",py:"普利沙娜"}
];
// 兼容旧数据：补齐次数；旧数据没有 status 时，根据次数推一个初始状态
words=words.map(w=>{
  const o={...w,known:w.known||0,maybe:w.maybe||0,forgot:w.forgot||0};
  if(o.status===undefined) o.status=o.forgot>0?"forgot":o.maybe>0?"maybe":o.known>0?"known":"";
  return o;
});
let mode="bs",current=null,pickMode="weighted",pickFilter="all",listFilter="all",sessionSeen=new Set(),editing=-1;
let todayCurrent=null,todayState=JSON.parse(localStorage.getItem("bosnian_today_v1")||"null");
const STATUS_ZH={known:"记住",maybe:"有印象",forgot:"忘记"};
const todayKey=()=>new Date().toLocaleDateString("zh-CN",{timeZone:"Europe/Sarajevo"});
function norm(s){return String(s||"").toLowerCase().replace(/đ/g,"d").normalize("NFD").replace(/[\u0300-\u036f]/g,"")}
function saveToday(){localStorage.setItem("bosnian_today_v1",JSON.stringify(todayState))}

/* ---------- 今日复习 ---------- */
function buildToday(){
  const base={forgot:5,maybe:2,"":1,known:-1.5};
  let scored=words.map((w,i)=>({i,score:base[w.status||""]+Math.min(w.forgot||0,5)*0.3+Math.random()}));
  scored.sort((a,b)=>b.score-a.score);
  return scored.slice(0,Math.min(10,words.length)).map(x=>x.i);
}
function startToday(force=false){
  const key=todayKey();
  if(force || !todayState || todayState.date!==key || !Array.isArray(todayState.ids)){
    todayState={date:key,ids:buildToday(),done:[],started:true};saveToday();
  }
  todayCurrent=null;todayNext();
}
function todayNext(){
  if(!todayState) startToday();
  const remaining=todayState.ids.filter(i=>!todayState.done.includes(i));
  if(!remaining.length){todayCurrent=null;document.getElementById("todayQuestion").textContent="今日复习完成 🎉";document.getElementById("todayAnswer").classList.add("hidden");updateTodayStats();return;}
  const i=remaining[Math.floor(Math.random()*remaining.length)];todayCurrent=words[i];
  document.getElementById("todayQuestion").textContent=mode==="bs"?todayCurrent.bs:todayCurrent.zh;
  document.getElementById("todayAnswer").classList.add("hidden");document.getElementById("todayAnswer").innerHTML="";updateTodayStats();
}
function todayReveal(){if(!todayCurrent)return;document.getElementById("todayAnswer").innerHTML=mode==="bs"?`中文：${esc(todayCurrent.zh)}<br>谐音：${esc(todayCurrent.py||"未填写")}`:`波斯尼亚语：${esc(todayCurrent.bs)}<br>谐音：${esc(todayCurrent.py||"未填写")}`;document.getElementById("todayAnswer").classList.remove("hidden")}
function todayRate(type){if(!todayCurrent)return;todayCurrent[type]=(todayCurrent[type]||0)+1;todayCurrent.status=type;const i=words.indexOf(todayCurrent);if(!todayState.done.includes(i))todayState.done.push(i);save();saveToday();todayNext()}
function updateTodayStats(){let total=todayState?.ids?.length||0,done=todayState?.done?.length||0;document.getElementById("todayStats").textContent=`今日：${done}/${total}　${done>=total&&total>0?"已完成":"剩余："+(total-done)}`}

/* ---------- 通用 ---------- */
function save(){localStorage.setItem(KEY,JSON.stringify(words))}
function showPage(id){["random","list","import","today"].forEach(x=>document.getElementById(x).classList.toggle("hidden",x!==id));if(id==="list")renderList()}
function setMode(m){mode=m;document.getElementById("modeBS").classList.toggle("primary",m==="bs");document.getElementById("modeZH").classList.toggle("primary",m==="zh");next();todayNext()}
function setPickMode(m){pickMode=m;sessionSeen=new Set();document.getElementById("pickWeighted").classList.toggle("primary",m==="weighted");document.getElementById("pickNoRepeat").classList.toggle("primary",m==="norepeat");next()}
function setFilter(f){pickFilter=f;sessionSeen=new Set();["all","maybe","forgot"].forEach(x=>document.getElementById("filter"+x.charAt(0).toUpperCase()+x.slice(1)).classList.toggle("primary",f===x));next()}
function eligible(){return words.map((w,i)=>({w,i})).filter(x=>{
  if(pickFilter==="all") return true;
  return x.w.status===pickFilter;
}).filter(x=>pickMode!=="norepeat" || !sessionSeen.has(x.i));}
function weightedPick(){
  let arr=eligible();if(!arr.length){if(pickMode==="norepeat"&&sessionSeen.size){sessionSeen=new Set();arr=eligible();}else return null;}
  // 状态决定基础权重：忘记最高，有印象次之，未标记中等，记住最低
  const base={forgot:4,maybe:2,"":1.5,known:0.3};
  let pool=[], total=0;
  arr.forEach(({w,i})=>{
    let weight=base[w.status||""]*(1+Math.min(w.forgot||0,5)*0.2);
    weight=Math.max(0.08,weight);total+=weight;pool.push({i,weight});
  });
  let r=Math.random()*total;for(const x of pool){r-=x.weight;if(r<=0)return words[x.i];}return words[pool[pool.length-1].i];
}
function next(){
  if(pickMode==="norepeat"){
    let arr=eligible();
    if(!arr.length){current=null;document.getElementById("question").textContent="本轮已经全部抽完 🎉";document.getElementById("answer").classList.add("hidden");updateStats();return;}
    let x=arr[Math.floor(Math.random()*arr.length)];current=x.w;sessionSeen.add(x.i);
  }else current=weightedPick();
  if(!current){document.getElementById("question").textContent="没有符合条件的单词";document.getElementById("answer").classList.add("hidden");updateStats();return;}
  document.getElementById("question").textContent=mode==="bs"?current.bs:current.zh;document.getElementById("answer").classList.add("hidden");document.getElementById("answer").innerHTML="";updateStats();
}
function reveal(){if(!current)return;document.getElementById("answer").innerHTML=mode==="bs"?`中文：${esc(current.zh)}<br>谐音：${esc(current.py||"未填写")}`:`波斯尼亚语：${esc(current.bs)}<br>谐音：${esc(current.py||"未填写")}`;document.getElementById("answer").classList.remove("hidden")}
function rate(type){if(!current)return;current[type]=(current[type]||0)+1;current.status=type;save();next();if(listFilter!=="all")renderList()}
function updateStats(){
  let total=words.length, filtered=words.filter(w=>pickFilter==="all"?true:w.status===pickFilter).length;
  let seen=pickMode==="norepeat"?sessionSeen.size:0;
  document.getElementById("pickStats").textContent=pickMode==="norepeat"?`总数：${filtered}　已随机单词：${seen}　剩余：${Math.max(0,filtered-seen)}`:`词库总数：${total}　当前范围：${filtered} 个词`;
  document.getElementById("stats").textContent=current?`当前词：${current.status?STATUS_ZH[current.status]:"未标记"}（记住 ${current.known||0} / 有印象 ${current.maybe||0} / 忘记 ${current.forgot||0}）`:"";
}
function resetStats(){if(!confirm("确定重置所有单词的记忆记录吗？"))return;words.forEach(w=>{w.known=w.maybe=w.forgot=0;w.status=""});sessionSeen=new Set();save();updateStats();renderList()}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}

/* ---------- 全部列表：标记 / 编辑 / 删除 ---------- */
function setListFilter(f){listFilter=f;editing=-1;["all","maybe","forgot","known","none"].forEach(x=>{let el=document.getElementById("list"+x.charAt(0).toUpperCase()+x.slice(1));if(el)el.classList.toggle("primary",f===x)});renderList()}
function setStatus(i,type){
  const w=words[i];if(!w)return;
  w.status=(w.status===type)?"":type;   // 再点一次同一个按钮 = 取消标记
  save();renderList();updateStats();
}
function startEdit(i){editing=i;renderList()}
function cancelEdit(){editing=-1;renderList()}
function saveEdit(i){
  const zh=document.getElementById("ez").value.trim(),bs=document.getElementById("eb").value.trim(),py=document.getElementById("ep").value.trim();
  if(!zh||!bs)return alert("中文和波斯尼亚语不能为空");
  const w=words[i];w.zh=zh;w.bs=bs;w.py=py;
  editing=-1;save();renderList();refreshQuestions();
}
function refreshQuestions(){
  if(current){document.getElementById("question").textContent=mode==="bs"?current.bs:current.zh;document.getElementById("answer").classList.add("hidden");}
  if(todayCurrent){document.getElementById("todayQuestion").textContent=mode==="bs"?todayCurrent.bs:todayCurrent.zh;document.getElementById("todayAnswer").classList.add("hidden");}
}
function delWord(i){
  const w=words[i];if(!w)return;
  if(!confirm(`确定删除「${w.bs} / ${w.zh}」吗？`))return;
  words.splice(i,1);
  // 今日复习保存的是下标，删除后要同步调整
  if(todayState&&Array.isArray(todayState.ids)){
    const f=a=>a.filter(x=>x!==i).map(x=>x>i?x-1:x);
    todayState.ids=f(todayState.ids);todayState.done=f(todayState.done);saveToday();
  }
  editing=-1;sessionSeen=new Set();save();renderList();next();todayNext();
}
function viewRow(w,i){
  const on=t=>w.status===t?" on":"";
  return `<div class="row"><div class="t"><div><div class="bs">${esc(w.bs)}</div><div class="zh">${esc(w.zh)}</div><div class="py">${esc(w.py||"")}</div></div><div class="cnt">记${w.known||0} 印${w.maybe||0} 忘${w.forgot||0}</div></div>
  <div class="st"><button class="s-forgot${on("forgot")}" onclick="setStatus(${i},'forgot')">忘记</button><button class="s-maybe${on("maybe")}" onclick="setStatus(${i},'maybe')">有印象</button><button class="s-known${on("known")}" onclick="setStatus(${i},'known')">记住</button><button onclick="startEdit(${i})">✎</button><button onclick="delWord(${i})">🗑</button></div></div>`;
}
function editRow(w,i){
  return `<div class="row"><input id="ez" value="${esc(w.zh)}" placeholder="中文"><input id="eb" value="${esc(w.bs)}" placeholder="波斯尼亚语"><input id="ep" value="${esc(w.py||"")}" placeholder="中文谐音"><div class="st2"><button class="primary" onclick="saveEdit(${i})">保存</button><button onclick="cancelEdit()">取消</button></div></div>`;
}
function renderList(){
  const q=norm(document.getElementById("search").value||"");
  const want=listFilter==="none"?"":listFilter;
  const rows=[];
  words.forEach((w,i)=>{
    if(listFilter!=="all"&&(w.status||"")!==want)return;
    if(q&&!norm(w.zh+" "+w.bs+" "+(w.py||"")).includes(q))return;
    rows.push(editing===i?editRow(w,i):viewRow(w,i));
  });
  document.getElementById("table").innerHTML=rows.join("")+`<p class="muted">筛选结果：${rows.length} 个词</p>`;
}

/* ---------- 导入 / 导出 ---------- */
const STATUS_MAP={"记住":"known","known":"known","有印象":"maybe","maybe":"maybe","忘记":"forgot","forgot":"forgot"};
function parseCSV(text){let lines=text.replace(/^\uFEFF/,"").split(/\r?\n/).map(x=>x.trim()).filter(Boolean);if(lines.length&&/^(中文|chinese)/i.test(lines[0]))lines.shift();return lines.map(line=>{let p=[],cur="",quote=false;for(let i=0;i<line.length;i++){let c=line[i];if(c==='"'){if(quote&&line[i+1]==='"'){cur+='"';i++}else quote=!quote}else if(c===','&&!quote){p.push(cur);cur=""}else cur+=c}p.push(cur);
  return {zh:(p[0]||"").trim(),bs:(p[1]||"").trim(),py:(p[2]||"").trim(),status:STATUS_MAP[(p[3]||"").trim().toLowerCase()]||"",known:parseInt(p[4])||0,maybe:parseInt(p[5])||0,forgot:parseInt(p[6])||0}}).filter(x=>x.zh&&x.bs)}
const dupKey=w=>w.zh.trim().toLowerCase()+"|"+w.bs.trim().toLowerCase();
function add(arr){
  const keys=new Set(words.map(dupKey));let added=0,skipped=0;
  arr.forEach(x=>{const k=dupKey(x);if(keys.has(k)){skipped++;return}keys.add(k);words.push(x);added++});
  save();renderList();next();
  alert("已导入 "+added+" 个词"+(skipped?"，跳过重复 "+skipped+" 个":""));
}
function importText(){add(parseCSV(document.getElementById("paste").value))}
function importFile(){let f=document.getElementById("file").files[0];if(!f)return alert("请选择CSV文件");let r=new FileReader();r.onload=()=>add(parseCSV(r.result));r.readAsText(f)}
function exportCSV(){
  const q=v=>`"${String(v).replaceAll('"','""')}"`;
  let t="中文,波斯尼亚语,中文谐音,状态,记住次数,有印象次数,忘记次数\n"+words.map(w=>[w.zh,w.bs,w.py||"",STATUS_ZH[w.status]||"",w.known||0,w.maybe||0,w.forgot||0].map(q).join(",")).join("\n");
  let a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["\ufeff"+t],{type:"text/csv;charset=utf-8"}));a.download="bosnian词库.csv";a.click();
}

save();next();startToday();
if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))}
</script>
</body>
</html>
